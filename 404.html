<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Открытие теста — НаУрок</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  box-sizing:border-box;
  background:linear-gradient(135deg,#fff2ae,#e8f7ff,#bfeaff);
  color:#1d1d1f;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  text-align:center;
}
main{
  max-width:420px;
  padding:28px;
  border-radius:18px;
  background:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
h1{font-size:21px;margin:0 0 10px}
p{color:#6e6e73}
</style>
</head>
<body>
<main>
  <h1>Открываю тест...</h1>
  <p id="status">Проверяю ссылку.</p>
</main>

<script>
(function(){
  const BASE="/";
  const path=location.pathname;

  if (!path.startsWith(BASE)) {
    document.getElementById("status").textContent=
      "Страница не найдена.";
    return;
  }

  const slug=path.slice(BASE.length).replace(/\/+$/,"");

  if (!/^[a-z]{3}-[a-z]{4}-[a-z]{3}$/.test(slug)) {
    document.getElementById("status").textContent=
      "Некорректная или несуществующая ссылка.";
    return;
  }

  location.replace(BASE+"?test="+encodeURIComponent(slug));
})();
</script>
</body>
</html>
